[project]
name = "interview-engine-service"
version = "0.1.0"
description = "Interview Engine Service for iBot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0,<1.14.0",
    "asyncpg>=0.29.0,<0.30.0",
    "celery[redis]>=5.4.0,<5.5.0",
    "deepgram-sdk>=7.3.0,<8.0.0",
    "fastapi>=0.111.0,<0.112.0",
    "groq>=0.9.0,<1.0.0",
    "httptools>=0.6.0",
    "httpx>=0.27.0,<0.28.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "python-json-logger>=2.0.7,<3.0.0",
    "python-multipart>=0.0.9,<0.1.0",
    "redis>=5.0.4,<6.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "structlog>=24.1.0,<25.0.0",
    "tenacity>=8.3.0,<9.0.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "websockets>=12.0,<13.0",
    "langgraph>=0.4.0,<1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "ruff>=0.12.0",
    "pre-commit>=3.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["N802", "N806", "N818", "B904", "B008", "SIM105", "E501", "E712"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = false
warn_redundant_casts = true
explicit_package_bases = true
namespace_packages = true
disallow_untyped_decorators = false
disable_error_code = ["no-any-return", "union-attr", "type-arg", "no-untyped-def", "no-untyped-call", "str-bytes-safe", "attr-defined"]
